<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static',path='reset_form_style.css')}}">
</head>
<body>
   <div class="container">
    <div class="header">
        <div class="logo">
            <p>H</p>
        </div>
        <p>Housify</p>
    </div>
    <h2>Set a new password</h2>
    <p>Your new password must be atleast 8 character long and must contain a capital letter,a number and a symbol</p>
    <form action="{{form_link}}" method="post">
        <div class="new-cont">
            <label for="new_password">New Password</label>
            <div class="password-container">
                <p>👁</p>
                <input type="password" name="new_password" id="new_pass">
            </div>
            <p class="error-message">Password doesn't match</p>
        </div>
        <div class="confirm-cont">
            <label for="confirm_password">Confirm Password</label>
            <div class="password-container">
                <p>👁</p>
                <input type="password" name="confirm_password" id="confirm_pass">
            </div>
            <p class="error-message">Password doesn't match</p>
        </div>
        <input type="submit" value="Update password">
        <p><a href="{{home_link}}">⬅ Back to login</a></p>
    </form>
   </div> 
   <script src="{{url_for('static',path='script.js')}}"></script>
</body>
</html>
