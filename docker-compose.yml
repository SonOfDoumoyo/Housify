version: '3.8' #Create the version

services: #Create the services you want to run together
  db:
    image: postgres:15
    restart: unless-stopped
    environment: 
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=housify123
      - POSTGRES_DB=housify
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  backend: #Build them
    build: 
      context: .
      dockerfile: ./backend/Dockerfile #Build the docker file from the path
    restart: unless-stopped
    ports: #Display the ports
      - "8001:8000"
    depends_on:
      - db
    env_file:
      - .env
volumes:
  postgres_data: